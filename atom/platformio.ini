; ctm-atom — ATOMS3R (8MB PSRAM) をサブモニタにするファームウェア
;
; ビルド:  pio run
; 書き込み: pio run -t upload   （ポートは自動検出。失敗時は本体リセット約2秒長押しで
;                                ダウンロードモード = 緑 LED 点灯にしてから再実行）
[env:atoms3r]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    m5stack/M5Unified @ ^0.2.17
    m5stack/M5GFX @ ^0.2.22
monitor_speed = 115200
